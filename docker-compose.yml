services:
  vulnerableapp-php:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DATABASE: vulnerableapp_php
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "8080:80"
    networks:
      app_net:
        aliases:
          - VulnerableApp-php

  vulnerableapp-facade:
    image: sasanlabs/owasp-vulnerableapp-facade:latest
    depends_on:
      - vulnerableapp-php
    ports:
      - "80:80"
    environment:
      NGINX_HOST: foobar.com
      NGINX_PORT: 80
      ENABLE_VULNERABLEAPP_PHP: "true"
      ENABLE_VULNERABLEAPP_JSP: "false"
      ENABLE_LLMFORGE: "false"
    networks:
      app_net:
        aliases:
          - VulnerableApp-facade

  mongodb:
    image: mongo:8.0
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app_net

networks:
  app_net:
    name: vulnerableapp-php_net
    driver: bridge
